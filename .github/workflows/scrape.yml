name: scrape-occupancy

on:
  schedule:
    # Every 15 minutes. NOTE: GitHub Actions cron is best-effort — runs are
    # often delayed 15–30 min and occasionally skipped. Fine for weekly averages.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Only one run at a time so commits don't race.
concurrency:
  group: scrape-occupancy
  cancel-in-progress: false

permissions:
  contents: write          # needed to commit the CSV back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python occupancy_scraper.py

      - name: Commit new data
        run: |
          git config user.name  "occupancy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/occupancy_lazdynu.csv
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
